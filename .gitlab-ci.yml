# Branch deployment_files: configuração de CI/CD do lab.
# Ao espelhar este repo em um GitLab CE local, ajuste apenas o namespace/projeto abaixo.
include:
  - project: 'Danylo93/platform-pipeline-templates'
    ref: main
    file: '/default-pipeline.yml'

variables:
  APP_NAME: platform-sample-application
  APP_PORT: "8080"
  HARBOR_HOST: "harbor.local"
  HARBOR_PROJECT: "platform-lab"
  GITOPS_BRANCH: "deployment_files"

# Para praticar uma exceção controlada ao Golden Path:
# troque '/default-pipeline.yml' por '/custom-pipeline.yml'.

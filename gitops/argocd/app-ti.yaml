apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-sample-ti
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Danylo93/platform-sample-application.git
    targetRevision: deployment_files
    path: gitops/chart
    helm:
      valueFiles:
        - ../environments/ti/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ti
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
